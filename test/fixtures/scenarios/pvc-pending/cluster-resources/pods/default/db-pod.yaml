apiVersion: v1
kind: Pod
metadata:
  name: db-pod
  namespace: default
  labels:
    app: database
spec:
  containers:
    - name: postgres
      image: postgres:15
      ports:
        - containerPort: 5432
      volumeMounts:
        - name: data-volume
          mountPath: /var/lib/postgresql/data
      env:
        - name: POSTGRES_PASSWORD
          value: "secretpassword"
  volumes:
    - name: data-volume
      persistentVolumeClaim:
        claimName: data-pvc
status:
  phase: Pending
  conditions:
    - type: Ready
      status: "False"
      reason: ContainersNotReady
      message: "containers with unready status: [postgres]"
    - type: PodScheduled
      status: "True"
  containerStatuses:
    - name: postgres
      ready: false
      restartCount: 0
      state:
        waiting:
          reason: ContainerCreating
          message: "waiting for volume 'data-volume' to be created"
