apiVersion: v1
kind: Node
metadata:
  name: worker-node-1
  labels:
    kubernetes.io/os: linux
    node-role.kubernetes.io/worker: "true"
spec:
  taints:
    - key: node.kubernetes.io/memory-pressure
      effect: NoSchedule
status:
  capacity:
    cpu: "8"
    memory: 16Gi
  allocatable:
    cpu: 7600m
    memory: 9Gi
  conditions:
    - type: Ready
      status: "True"
      reason: KubeletReady
      message: kubelet is posting ready status
    - type: MemoryPressure
      status: "True"
      reason: KubeletHasMemoryPressure
      message: kubelet has memory pressure and is evicting pods
    - type: DiskPressure
      status: "False"
      reason: KubeletHasNoDiskPressure
      message: kubelet has no disk pressure
    - type: PIDPressure
      status: "False"
      reason: KubeletHasSufficientPID
      message: kubelet has sufficient PID available
