# ===========================================================================
# Support Bundle Investigator — GitLab CI/CD
# ===========================================================================
#
# Pipeline structure:
#   1. test:unit     — lint, typecheck, 3,800+ tests (every push)
#   2. test:replay   — replay committed cassettes, verify pipeline output
#   3. nightly:record — real LLM calls and refreshed cassette artifacts

stages:
  - test
  - evaluate
  - nightly

# ---------------------------------------------------------------------------
# Shared setup
# ---------------------------------------------------------------------------

.node_setup: &node_setup
  image: node:20-alpine
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  before_script:
    - npm ci --prefer-offline

# ===========================================================================
# Stage 1: Unit tests (every push and MR)
# ===========================================================================

test:unit:
  <<: *node_setup
  stage: test
  script:
    - npm run lint
    - npm run typecheck
    - npm run build
    - npm run unit
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# ===========================================================================
# Stage 2: Replay evaluation (every MR — uses cached cassettes)
# ===========================================================================

test:replay:
  <<: *node_setup
  stage: evaluate
  needs: [test:unit]
  variables:
    SBI_AI_MODE: replay
    SBI_CASSETTE_DIR: test/fixtures/cassettes
  script:
    - npm run build
    - test -f test/fixtures/cassettes/cassettes.json
    - npm run eval:cassette -- --reporter=verbose
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - src/**/*
        - test/**/*

# ===========================================================================
# Stage 3: Nightly evaluation (scheduled — real LLM calls)
# ===========================================================================

nightly:record:
  <<: *node_setup
  stage: nightly
  variables:
    SBI_AI_MODE: record
    SBI_CASSETTE_DIR: test/fixtures/cassettes
    SBI_EMBEDDING_BACKEND: none
    SBI_AI_MODEL: gpt-5.6-terra
  script:
    - npm run build
    - npm run cassettes:record
    - test -s test/fixtures/cassettes/cassettes.json
  artifacts:
    paths:
      - test/fixtures/cassettes/cassettes.json
      - test/golden/cassette-record-report.json
    expire_in: 30 days
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  allow_failure: false
